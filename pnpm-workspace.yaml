packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for versions used by more than one workspace package.
# Packages reference these with `catalog:` instead of a literal range.
#
# This matters most for vanilla-extract: it keys styles by file scope, so two
# resolved copies of @vanilla-extract/css means scope is written to one instance
# and read from the other. That fails at build time with the opaque "Styles were
# unable to be assigned to a file", and drifting ranges alone are enough to
# cause it.
catalog:
  '@tanstack/react-router': ^1.131.36
  '@tanstack/router-plugin': ^1.131.36
  '@types/react': ^19.1.12
  '@types/react-dom': ^19.1.9
  '@vanilla-extract/css': ^1.17.5
  '@vanilla-extract/recipes': ^0.5.7
  '@vanilla-extract/vite-plugin': ^5.1.3
  react: ^19.1.1
  react-dom: ^19.1.1
  vite: ^6.4.1
  vitest: ^4.0.18

catalogs:
  # Peer ranges are deliberately wider than the versions we build against, so
  # they cannot share the entries above. Keeping them here still pins the
  # supported range in one place.
  peers:
    react: ^18.0.0 || ^19.0.0
    react-dom: ^18.0.0 || ^19.0.0
