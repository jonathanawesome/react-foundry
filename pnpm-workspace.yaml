packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for versions used by more than one workspace package.
# Packages reference these with `catalog:` instead of a literal range.
#
# Versions are pinned exactly, not carets. A range lets two packages resolve
# different copies of the same dependency, and for vanilla-extract that is fatal
# rather than wasteful: it keys styles by file scope, so scope written to one
# instance is invisible to the other and the build fails with the opaque
# "Styles were unable to be assigned to a file".
#
# Upgrades come from Renovate (see .github/renovate.json), which raises them here
# in one place after a cooldown period rather than resolving silently on install.
catalog:
  '@tanstack/react-router': 1.170.18
  '@tanstack/router-plugin': 1.168.23
  '@testing-library/dom': 10.4.1
  '@testing-library/jest-dom': 6.9.1
  '@testing-library/react': 16.3.2
  '@testing-library/user-event': 14.6.1
  '@types/react': 19.2.7
  '@types/react-dom': 19.2.3
  '@vanilla-extract/css': 1.21.1
  '@vanilla-extract/recipes': 0.5.7
  '@vanilla-extract/vite-plugin': 5.2.5
  jsdom: 29.1.1
  react: 19.2.1
  react-dom: 19.2.1
  typescript: 6.0.3
  vite: 8.1.5
  vitest: 4.1.10

catalogs:
  # Peer ranges stay ranges on purpose. A peer declares what a consumer may
  # bring, so pinning one would force every consumer onto our exact version.
  peers:
    react: ^18.0.0 || ^19.0.0
    react-dom: ^18.0.0 || ^19.0.0

onlyBuiltDependencies:
  - esbuild