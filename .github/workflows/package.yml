name: Package

# Proves the publishable package end to end: builds react-foundry, installs the packed
# tarball into a throwaway project outside the monorepo, and drives foundry dev/build/preview.

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/verify-tarball.sh'
      - '.github/workflows/package.yml'
  push:
    branches: [main]

jobs:
  package:
    name: package (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Runs on the supported Node range because this path is unusually sensitive to
        # Node/ESM behavior.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds react-foundry, packs it, installs into a clean consumer, runs the CLI.
      - run: bash scripts/verify-tarball.sh

      # Lint the package's published shape (exports, types, files). Uses the dist the
      # tarball script just built.
      - run: pnpm --filter react-foundry exec publint

      # Verify the emitted .d.ts resolve for consumers (node16-ESM + bundler), gating
      # declaration drift that publint (structure only) and the runtime tarball test
      # (transpile only) cannot catch. Pack with pnpm from the package dir so
      # publishConfig + catalog: are applied (attw's own --pack shells out to `npm pack`,
      # which mangles both); the root package shares the `react-foundry` name, so
      # `--filter` would pack the wrong one. esm-only profile: the package is
      # intentionally ESM-only, so node10 / CJS non-resolution is expected.
      - name: attw (declaration resolution)
        working-directory: packages/react-foundry
        run: |
          tarball="$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          pnpm exec attw "$tarball" --profile esm-only
