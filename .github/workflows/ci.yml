name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: pnpm` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm types
      - run: pnpm check
      - run: pnpm test

  # Proves the publishable package end to end: builds it, installs the packed tarball into a
  # throwaway project outside the monorepo, and drives foundry dev/build/preview. Runs on the
  # supported Node range because this path is unusually sensitive to Node/ESM behavior.
  package:
    name: package (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds react-foundry, packs it, installs into a clean consumer, runs the CLI.
      - run: bash scripts/verify-tarball.sh

      # Lint the package's published shape (exports, types, files). Uses the dist the
      # tarball script just built.
      - run: pnpm --filter react-foundry exec publint
